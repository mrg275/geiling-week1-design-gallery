<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v11 · The Geiling Collection — Walkable Museum</title>
<style>
  :root{
    --ink:#2b2318;
    --ivory:#f7f1e4;
    --paper:#faf5ea;
    --brass:#a8864b;
    --brass-lt:#cfa75f;
    --brass-dk:#7c6133;
    --stone:#e9e2d2;
    --oxblood:#6e3a32;
    --olive:#5c6b4a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#171210;color:var(--ink);
    font-family:Georgia,'Iowan Old Style','Times New Roman',serif;
    overflow:hidden;
  }
  [hidden]{display:none !important}
  button{font-family:inherit;cursor:pointer}

  /* ============ 3D VIEWPORT ============ */
  #viewport{
    position:fixed;inset:0;overflow:hidden;
    perspective:700px;perspective-origin:50% 50%;
    background:#0e0b08;
    touch-action:none;user-select:none;-webkit-user-select:none;
    cursor:grab;
  }
  #viewport.dragging{cursor:grabbing}
  #world{
    position:absolute;left:50%;top:50%;width:0;height:0;
    transform-style:preserve-3d;will-change:transform;
  }
  .pl{
    position:absolute;left:0;top:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
  }

  /* --- architecture --- */
  .wall{
    background:
      radial-gradient(ellipse 140% 90% at 50% 45%, rgba(255,243,219,.22), rgba(31,22,12,.26) 92%),
      repeating-linear-gradient(90deg, rgba(120,100,70,.05) 0 2px, transparent 2px 230px),
      linear-gradient(180deg,
        #f4efe3 0, #efe9da 30px, #c9bda3 33px, #b3a584 35px,
        #f0eadc 36px, #ede6d7 86px,
        #b89a63 88px, #8f7440 91px,
        #ece4d4 92px, #e7dfcd 316px,
        #cdc1a7 318px, #bfb192 321px,
        #ddd3bd 322px, #d7cdb5 410px,
        #6e5d45 412px, #514334 428px, #3a2f24 440px);
  }
  .floor{
    background:
      radial-gradient(ellipse 60% 55% at 50% 50%, rgba(255,241,210,.14), rgba(20,12,6,.38) 96%),
      repeating-linear-gradient(45deg, rgba(62,38,18,.15) 0 2px, transparent 2px 34px),
      repeating-linear-gradient(-45deg, rgba(62,38,18,.12) 0 2px, transparent 2px 34px),
      repeating-linear-gradient(90deg, rgba(255,228,180,.05) 0 3px, transparent 3px 68px),
      linear-gradient(180deg,#9c7c55,#866745);
    box-shadow:inset 0 0 0 52px rgba(214,201,174,.5), inset 0 0 0 56px rgba(74,54,32,.55);
  }
  .rug{
    background:
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(255,210,160,.07), transparent 70%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 2px, transparent 2px 14px),
      linear-gradient(180deg,#643933,#57302b);
    box-shadow:inset 0 0 0 9px #46251f, inset 0 0 0 12px #bd9757, inset 0 0 0 24px #46251f;
  }
  .ceiling{
    background:
      radial-gradient(ellipse 45% 30% at 50% 28%, rgba(255,244,214,.5), transparent 70%),
      radial-gradient(ellipse 45% 30% at 50% 72%, rgba(255,244,214,.5), transparent 70%),
      linear-gradient(90deg,#c9c0ae 0 30%, #efe9da 42% 58%, #c9c0ae 70%);
  }

  /* --- paintings --- */
  .art{cursor:pointer}
  .art .spot{
    position:absolute;left:50%;top:-150px;width:380px;height:520px;
    transform:translateX(-50%);pointer-events:none;
    background:radial-gradient(ellipse 50% 42% at 50% 24%, rgba(255,240,205,.5), rgba(255,240,205,0) 68%);
  }
  .art .frame{
    position:relative;margin:0 auto;padding:13px;
    background:linear-gradient(145deg,#6b5126,#9c7a3d 30%,#5d4720 60%,#8a6c35);
    border:1px solid #3c2e14;
    box-shadow:
      inset 0 0 0 4px #43340f,
      inset 0 0 0 6px #c9a75d,
      0 14px 26px rgba(0,0,0,.45);
    transition:box-shadow .25s;
  }
  .art:hover .frame{
    box-shadow:
      inset 0 0 0 4px #43340f,
      inset 0 0 0 6px #e4c478,
      0 0 0 3px rgba(255,222,150,.55),
      0 14px 30px rgba(0,0,0,.5);
  }
  .art .canvas{
    width:100%;height:100%;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:7px;text-align:center;padding:12px;overflow:hidden;
    box-shadow:inset 0 0 26px rgba(0,0,0,.35);
  }
  .art .canvas::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse at 30% 18%, rgba(255,255,255,.2), transparent 55%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 3px);
  }
  .c-type{font-size:9px;letter-spacing:3px;color:rgba(255,250,240,.75);text-transform:uppercase}
  .c-title{font-size:17px;line-height:1.25;color:#fffdf6;font-style:italic;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .c-author{font-size:10px;letter-spacing:2px;color:rgba(255,250,240,.85);text-transform:uppercase}
  .canvas.lightface .c-type,.canvas.lightface .c-author{color:rgba(50,38,20,.8)}
  .canvas.lightface .c-title{color:#33281a;text-shadow:0 1px 2px rgba(255,255,255,.5)}
  .art .plaque{
    width:82%;margin:12px auto 0;padding:7px 8px 8px;text-align:center;
    background:linear-gradient(180deg,#e0c183,#b8924e 55%,#a07c3c);
    border:1px solid #6e5527;border-radius:2px;
    box-shadow:0 3px 7px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,240,200,.6);
    color:#3a2b10;
  }
  .plaque b{display:block;font-size:14px;line-height:1.2;text-shadow:0 1px 0 rgba(255,236,190,.5)}
  .plaque span{display:block;font-size:10.5px;margin-top:2px;letter-spacing:.4px}
  .plaque .pq-c{font-style:italic;opacity:.85}

  /* --- wall signs / wing labels --- */
  .wing-sign{
    display:flex;align-items:center;justify-content:center;
    font-size:19px;letter-spacing:5px;color:#4a3a18;
    background:linear-gradient(180deg,#dcc088,#b8924e);
    border:1px solid #6e5527;border-radius:3px;
    box-shadow:0 4px 9px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,240,200,.6);
    text-shadow:0 1px 0 rgba(255,236,190,.55);
    white-space:nowrap;
  }
  .wing-sign small{font-size:11px;letter-spacing:3px;margin-left:12px;opacity:.75}

  /* --- study room doorway --- */
  .door{
    cursor:pointer;
    background:
      radial-gradient(ellipse 80% 45% at 50% 96%, rgba(255,190,110,.4), transparent 70%),
      linear-gradient(180deg,#191109 0,#0f0a05 100%);
    border:7px solid #4a3621;border-bottom:none;
    box-shadow:inset 0 0 36px rgba(0,0,0,.9), 0 0 0 2px #2e2213;
  }
  .door .door-desk{
    position:absolute;left:22%;right:22%;bottom:18%;height:7px;background:#3a2412;
    box-shadow:0 10px 0 -3px #2a1a0c, 0 -16px 14px rgba(255,180,100,.18);
  }
  .door .door-lamp{
    position:absolute;left:50%;bottom:27%;width:34px;height:34px;transform:translateX(-50%);
    background:radial-gradient(circle, rgba(255,214,140,.95), rgba(255,180,90,.25) 55%, transparent 72%);
    border-radius:50%;
  }
  .door .door-plate{
    position:absolute;left:50%;top:-58px;transform:translateX(-50%);
    padding:6px 16px;white-space:nowrap;
    font-size:15px;letter-spacing:4px;color:#4a3a18;
    background:linear-gradient(180deg,#dcc088,#b8924e);
    border:1px solid #6e5527;border-radius:3px;
    box-shadow:0 3px 7px rgba(0,0,0,.4);
  }
  .door .door-sub{
    position:absolute;left:50%;top:-24px;transform:translateX(-50%);
    font-size:10px;letter-spacing:3px;color:#d9c08b;white-space:nowrap;
  }

  /* --- stations: wood, glass, pages --- */
  .wood{background:linear-gradient(180deg,#5f4631,#4c3826);box-shadow:inset 0 0 0 2px rgba(30,18,8,.55), inset 0 6px 14px rgba(255,220,170,.12);cursor:pointer}
  .wood.f-n,.wood.f-w{filter:brightness(.78)}
  .wood.f-e{filter:brightness(.9)}
  .wood.f-t{background:linear-gradient(135deg,#75583c,#5d462e);box-shadow:inset 0 0 0 2px rgba(30,18,8,.5)}
  .ped{background:linear-gradient(180deg,#d8d0bd,#b8ae96);box-shadow:inset 0 0 0 2px rgba(90,80,60,.4), inset 0 -16px 22px rgba(60,48,30,.25);cursor:pointer}
  .ped.f-n,.ped.f-w{filter:brightness(.82)}
  .ped.f-t{background:linear-gradient(135deg,#e4dccb,#cfc6ae)}
  .glass{
    background:linear-gradient(160deg, rgba(216,236,242,.22), rgba(190,214,224,.08) 55%, rgba(255,255,255,.16));
    border:1px solid rgba(240,250,255,.5);
    backface-visibility:visible;-webkit-backface-visibility:visible;
    cursor:pointer;
  }
  .page{
    background:linear-gradient(90deg,#f1e8d6 0 49%, #cdbf9f 49% 51%, #e6dbc2 51% 100%);
    border:1px solid #9c8c6a;box-shadow:0 4px 8px rgba(0,0,0,.35);cursor:pointer;
  }
  .relic{
    background:linear-gradient(135deg,#f6efdd,#e8ddc2);
    border:1px solid #a89468;box-shadow:0 6px 10px rgba(0,0,0,.3);
    display:flex;align-items:center;justify-content:center;
    font-size:8px;letter-spacing:1px;color:#6e5c3a;text-align:center;padding:4px;
    cursor:pointer;
  }
  .case-plate{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    padding:4px 10px;font-size:9px;letter-spacing:2.5px;white-space:nowrap;color:#3a2b10;
    background:linear-gradient(180deg,#dcc088,#b8924e);border:1px solid #6e5527;border-radius:2px;
  }

  /* --- collection map frame --- */
  .map-frame{
    cursor:pointer;padding:16px;
    background:linear-gradient(145deg,#6b5126,#9c7a3d 30%,#5d4720 60%,#8a6c35);
    border:1px solid #3c2e14;
    box-shadow:inset 0 0 0 4px #43340f, inset 0 0 0 6px #c9a75d, 0 16px 30px rgba(0,0,0,.5);
  }
  .map-inner{
    width:100%;height:100%;background:linear-gradient(160deg,#20301f,#17241a);
    box-shadow:inset 0 0 30px rgba(0,0,0,.6);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;
  }
  .map-inner h3{font-size:17px;letter-spacing:5px;color:#d9c08b;font-weight:normal}
  .map-inner p{font-size:10px;letter-spacing:2px;color:#9cab8c}
  .map-inner svg{width:62%;height:auto}
  .map-frame .spot{
    position:absolute;left:50%;top:-150px;width:560px;height:560px;
    transform:translateX(-50%);pointer-events:none;
    background:radial-gradient(ellipse 50% 40% at 50% 24%, rgba(255,240,205,.45), transparent 68%);
  }

  /* minimap svg shared classes */
  .mm-hall{fill:rgba(250,244,230,.92);stroke:#a8864b;stroke-width:2}
  .mm-w{fill:#a8864b;cursor:pointer}
  .mm-w:hover{fill:#6e3a32}
  .mm-st{fill:#5c6b4a;cursor:pointer}
  .mm-st:hover{fill:#6e3a32}
  .mm-rug{fill:rgba(110,58,50,.25)}
  #mm-cam{fill:#6e3a32;stroke:#f7f1e4;stroke-width:1}
  .wallmap .mm-hall{fill:rgba(20,32,20,.3);stroke:#c9a75d;stroke-width:3}
  .wallmap .mm-w{fill:#d9c08b}
  .wallmap .mm-st{fill:#8fa37c}
  .wallmap .mm-rug{fill:rgba(217,192,139,.12)}

  /* ============ HUD ============ */
  #hud{
    position:fixed;top:0;left:0;right:0;z-index:45;
    display:flex;align-items:center;gap:14px;padding:9px 16px;
    background:linear-gradient(180deg, rgba(27,20,12,.92), rgba(27,20,12,.78));
    border-bottom:1px solid rgba(201,167,93,.55);
    color:var(--ivory);
    backdrop-filter:blur(4px);
  }
  #hud .gal{
    color:#e5cf9d;text-decoration:none;font-size:13.5px;letter-spacing:.5px;
    padding:5px 10px;border:1px solid rgba(201,167,93,.6);border-radius:3px;white-space:nowrap;
  }
  #hud .gal:hover{background:rgba(201,167,93,.18)}
  #hud .hud-title{line-height:1.1;min-width:0}
  #hud .hud-title b{display:block;font-size:14.5px;letter-spacing:3px;font-weight:normal;color:#f3e7c8;white-space:nowrap}
  #hud .hud-title span{display:block;font-size:10px;letter-spacing:1.5px;color:#b9a87f;font-style:italic;white-space:nowrap}
  #hud .spacer{flex:1}
  #hud .hint{font-size:11px;color:#b9a87f;letter-spacing:.5px;white-space:nowrap}
  #badge{
    display:flex;align-items:center;gap:6px;white-space:nowrap;
    background:linear-gradient(180deg,#dcc088,#b8924e);color:#3a2b10;border:1px solid #6e5527;
    padding:5px 11px;border-radius:20px;font-size:12.5px;font-family:inherit;letter-spacing:.5px;
    box-shadow:inset 0 1px 0 rgba(255,240,200,.6);
  }
  #badge:hover{filter:brightness(1.08)}
  #badge .dot{width:8px;height:8px;border-radius:50%;background:#6e3a32;box-shadow:0 0 5px rgba(110,30,20,.8)}
  #fp-btn{
    background:transparent;color:#e5cf9d;border:1px solid rgba(201,167,93,.6);
    padding:5px 11px;border-radius:3px;font-size:12.5px;letter-spacing:.5px;white-space:nowrap;
  }
  #fp-btn:hover{background:rgba(201,167,93,.18)}

  /* ============ MINIMAP PANEL ============ */
  #mapwrap{
    position:fixed;top:64px;right:14px;z-index:25;width:128px;
    display:flex;flex-direction:column;gap:6px;
  }
  #minimap{
    background:rgba(27,20,12,.85);border:1px solid rgba(201,167,93,.55);border-radius:4px;padding:6px;
  }
  #minimap svg{display:block;width:100%;height:auto}
  .qbtn{
    background:rgba(27,20,12,.85);color:#e5cf9d;border:1px solid rgba(201,167,93,.5);
    border-radius:3px;padding:5px 8px;font-size:11.5px;letter-spacing:1px;text-align:left;
    display:flex;justify-content:space-between;align-items:center;
  }
  .qbtn:hover{background:rgba(201,167,93,.22)}
  .qbtn em{font-style:normal;font-size:9px;opacity:.65}

  /* ============ VIGNETTE ============ */
  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:10;
    background:radial-gradient(ellipse 75% 70% at 50% 46%, transparent 55%, rgba(10,6,3,.5) 100%);
  }

  /* ============ OVERLAY PANELS ============ */
  #overlay{
    position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:rgba(16,11,6,.6);padding:66px 18px 18px;
  }
  .panel{
    width:min(780px,100%);max-height:min(calc(100vh - 92px),860px);overflow:auto;
    background:linear-gradient(180deg,#fbf6eb,#f4edda);
    border:1px solid #b99a5e;border-radius:5px;
    box-shadow:0 24px 70px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,250,235,.7);
  }
  .panel>header{
    position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;
    padding:15px 20px 12px;background:linear-gradient(180deg,#fbf6eb 70%, rgba(251,246,235,.92));
    border-bottom:2px solid var(--brass);
  }
  .panel>header h2{
    font-size:19px;font-weight:normal;letter-spacing:2.5px;text-transform:uppercase;color:#4a3a1c;flex:1;min-width:0
  }
  .panel>header .sub{font-size:11px;letter-spacing:1px;color:#8a7850;font-style:italic;white-space:nowrap}
  #ov-close{
    background:transparent;border:1px solid #b99a5e;border-radius:3px;color:#7c6133;
    width:30px;height:30px;font-size:17px;line-height:1;flex:none;
  }
  #ov-close:hover{background:#efe3c8}
  .panel .body{padding:18px 22px 24px}

  .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;margin-bottom:14px}
  .meta-grid dt{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#8a7850}
  .meta-grid dd{font-size:14.5px;margin-top:2px}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 4px}
  .tag{
    font-size:11px;letter-spacing:1px;padding:3px 10px;border-radius:12px;border:1px solid #b99a5e;
    background:#f3ead2;color:#6e5527;cursor:pointer;
  }
  .tag:hover{background:#e8d9b4}
  .sect{margin-top:20px}
  .sect>h3{
    font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:#7c6133;
    border-bottom:1px solid #d9c8a2;padding-bottom:5px;margin-bottom:10px;font-weight:normal;
  }
  blockquote{
    margin:10px 0;padding:10px 14px;border-left:3px solid var(--brass);
    background:rgba(201,167,93,.1);font-style:italic;font-size:14.5px;line-height:1.5;
  }
  .note{border:1px solid #ddcda6;border-radius:4px;padding:10px 12px;margin-bottom:9px;background:#fdfaf2}
  .note-meta{font-size:10.5px;letter-spacing:1px;color:#8a7850;text-transform:uppercase;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
  .note-text{font-size:14px;line-height:1.55;white-space:pre-wrap}
  .mini{
    background:transparent;border:1px solid #b99a5e;border-radius:3px;color:#7c6133;
    font-size:10.5px;letter-spacing:1px;padding:2px 9px;text-transform:uppercase;
  }
  .mini:hover{background:#efe3c8}
  textarea,select,input{
    width:100%;font-family:inherit;font-size:14px;color:var(--ink);
    background:#fffdf6;border:1px solid #c0ab7c;border-radius:4px;padding:9px 11px;
  }
  textarea{min-height:88px;resize:vertical;line-height:1.5}
  textarea:focus,select:focus{outline:2px solid rgba(168,134,75,.5)}
  .btn{
    background:linear-gradient(180deg,#dcc088,#b8924e);color:#3a2b10;border:1px solid #6e5527;
    border-radius:4px;padding:8px 18px;font-size:13.5px;letter-spacing:1px;
    box-shadow:inset 0 1px 0 rgba(255,240,200,.6), 0 2px 4px rgba(0,0,0,.15);
  }
  .btn:hover{filter:brightness(1.07)}
  .btn.ghost{background:#f6efdc;color:#6e5527;box-shadow:none}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .muted{color:#8a7850;font-size:12.5px;font-style:italic}

  /* flashcard flip */
  .fc{perspective:1100px;height:250px;cursor:pointer;margin:14px 0}
  .fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s}
  .fc.flip .fc-inner{transform:rotateY(180deg)}
  .fc-face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    border:1px solid #b99a5e;border-radius:6px;padding:22px 26px;text-align:center;
    background:linear-gradient(180deg,#fffdf6,#f6edd6);
    box-shadow:0 8px 20px rgba(60,40,10,.18), inset 0 0 0 5px rgba(201,167,93,.22);
  }
  .fc-face.fc-back{transform:rotateY(180deg);background:linear-gradient(180deg,#f8f1de,#efe3c4)}
  .fc-k{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#a8864b}
  .fc-q{font-size:17.5px;line-height:1.45}
  .fc-a{font-size:15px;line-height:1.5}
  .grade-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  .grade{
    border-radius:4px;border:1px solid;padding:7px 13px;font-size:13px;min-width:86px;
    display:flex;flex-direction:column;align-items:center;gap:1px;background:#fffdf6;
  }
  .grade small{font-size:10px;opacity:.7}
  .g0{border-color:#9c4a3c;color:#8a3a2c}.g0:hover{background:#f6e0da}
  .g1{border-color:#b0803a;color:#8a6226}.g1:hover{background:#f6ecd8}
  .g2{border-color:#6b7d4a;color:#53633a}.g2:hover{background:#eaf0da}
  .g3{border-color:#3f6b52;color:#2f5540}.g3:hover{background:#dcefe3}

  .fp-item{
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    padding:8px 4px;border-bottom:1px solid #e6d9b8;
  }
  .fp-item b{font-size:14.5px;font-weight:normal;font-style:italic}
  .fp-item .fp-meta{font-size:11.5px;color:#8a7850}
  .fp-item .row{margin-left:auto}

  .refl{border:1px solid #ddcda6;border-radius:4px;padding:11px 13px;margin-bottom:10px;background:#fdfaf2}
  .refl .rq{font-size:12.5px;font-style:italic;color:#7c6133;margin:4px 0 7px;line-height:1.45}

  /* graph */
  #graph-wrap svg{width:100%;height:auto;display:block;background:#fdfaf2;border:1px solid #ddcda6;border-radius:5px}
  .gnode{cursor:pointer}
  .gnode circle{stroke:#5b4720;stroke-width:1.2;transition:opacity .15s}
  .gnode text{font-size:10.5px;fill:#4a3a1c;text-anchor:middle;pointer-events:none}
  .gedge{stroke:#a8864b;fill:none;transition:opacity .15s}
  svg.hl .gnode{opacity:.16}
  svg.hl .gnode.on{opacity:1}

  });

function nextState(c, g){
  var now = Date.now();
  if (g === 0){
    return { ease: Math.max(1.3, c.ease - 0.2), interval: 0, reps: 0, due: now + 10 * 60000 };
  }
  var ease = Math.min(2.8, Math.max(1.3, c.ease + (g === 1 ? -0.15 : g === 3 ? 0.15 : 0)));
  var interval;
  if (c.reps === 0) interval = g === 1 ? 1 : g === 2 ? 2 : 4;
  else interval = Math.max(1, Math.round(c.interval * (g === 1 ? 1.2 : g === 2 ? ease : ease * 1.35)));
  return { ease: ease, interval: interval, reps: c.reps + 1, due: now + interval * DAY };
}
function previewLabel(c, g){
  var s = nextState(c, g);

function mapPt(x, z, w, h){
  return [ (x + HALF_W) / (2*HALF_W) * (w - 16) + 8,

}
function mapSVG(w, h, interactive, cls){
  var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" class="' + (cls||'') + '" xmlns="http://www.w3.org/2000/svg">';
  s += '<rect x="8" y="8" width="' + (w-16) + '" height="' + (h-16) + '" class="mm-hall" rx="2"/>';
  var rp = mapPt(-190, -1500, w, h), rp2 = mapPt(190, 1600, w, h);
  s += '<rect x="' + rp[0] + '" y="' + rp[1] + '" width="' + (rp2[0]-rp[0]) + '" height="' + (rp2[1]-rp[1]) + '" class="mm-rug"/>';
  WORKS.forEach(function(wk){

    s += '<circle cx="' + pt[0].toFixed(1) + '" cy="' + pt[1].toFixed(1) + '" r="4.5" class="mm-w"' +
         (interactive ? ' data-act="work:' + wk.id + '"' : '') + '><title>' + esc(wk.title) + '</title></circle>';
  });
  Object.keys(STATION_POS).forEach(function(id){
    var sp = STATION_POS[id], pt = mapPt(sp[0], sp[1], w, h);
    s += '<rect x="' + (pt[0]-4.5).toFixed(1) + '" y="' + (pt[1]-4.5).toFixed(1) + '" width="9" height="9" class="mm-st"' +
         (interactive ? ' data-act="station:' + id + '"' : '') + '><title>' + STATION_NAME[id] + '</title></rect>';
  });

/* ---------------------- CAMERA / MOVEMENT ---------------------- */
var PERSP = 700;
var cam = { x:0, z:1480, yaw:0 };
var tgt = { x:0, z:1480, yaw:0 };
var keys = {};
var glide = null, pendingOpen = null;
var lastTs = 0;

function clampPos(p){
  p.x = clamp(p.x, -(HALF_W-230), HALF_W-230);
  p.z = clamp(p.z, -(HALF_D-220), HALF_D-220);
  if (Math.abs(p.x) < 200 && Math.abs(p.z) < 200){
    if (Math.abs(p.x) > Math.abs(p.z)) p.x = (p.x >= 0 ? 1 : -1) * 200;
    else p.z = (p.z >= 0 ? 1 : -1) * 200;
  }
}
function glideTo(stand, open){
  glide = { x: stand.x, z: stand.z, yaw: stand.yaw };
  pendingOpen = open || null;
  tgt.x = stand.x; tgt.z = stand.z;
  clampPos(tgt);
  tgt.yaw = cam.yaw + shortAngle(stand.yaw - cam.yaw);
}
function cancelGlide(){ glide = null; pendingOpen = null; }

function standForWork(w){
  var p = PLACE[w.id], x = p[0], z = p[1], ry = p[2], d = 290;
  if (ry === 90)  return { x: x + d, z: z, yaw:  Math.PI/2 };
  if (ry === -90) return { x: x - d, z: z, yaw: -Math.PI/2 };
  if (ry === 0)   return { x: x, z: z + d, yaw: 0 };
  return { x: x, z: z - d, yaw: Math.PI };
}
var STATIONS = {
  flash:   { stand:{ x:-770, z:1280, yaw: Math.PI/2 },  open: function(){ showFlashcards(); } },
  recall:  { stand:{ x: 360, z:-1620, yaw:-Math.PI/2 }, open: function(){ showRecall(); } },
  reflect: { stand:{ x:-350, z:1400, yaw: Math.PI },    open: function(){ showReflections(); } },
  graph:   { stand:{ x: 0, z:-1300, yaw: 0 },           open: function(){ showGraph(); } },
  seren:   { stand:{ x: 0, z: 330, yaw: 0 },            open: function(){ showSerendipity(); } }
};
function approach(kind, id){
  var stand, open;
  if (kind === 'work'){
    var w = byId(id);
    if (!w) return;
    stand = standForWork(w);
    open = function(){ showDetail(id); };
  } else {
    var s = STATIONS[id];
    if (!s) return;
    stand = s.stand;
    open = s.open;
  }
  var d = Math.hypot(cam.x - stand.x, cam.z - stand.z);
  if (d < 150 && Math.abs(shortAngle(stand.yaw - cam.yaw)) < 1.2){ open(); }
  else glideTo(stand, open);
}

var vp = document.getElementById('viewport');
var dragState = null, dragMoved = false;
vp.addEventListener('pointerdown', function(e){
  if (!$('#overlay').hidden) return;
  dragState = { id: e.pointerId, lx: e.clientX, total: 0 };
  dragMoved = false;
  try { vp.setPointerCapture(e.pointerId); } catch(err){}
});
vp.addEventListener('pointermove', function(e){
  if (!dragState || e.pointerId !== dragState.id) return;
  var dx = e.clientX - dragState.lx;
  dragState.lx = e.clientX;
  dragState.total += Math.abs(dx);
  if (dragState.total > 6){
    dragMoved = true;
    vp.classList.add('dragging');
    cancelGlide();
    tgt.yaw -= dx * 0.0042;
  }
});
function endDrag(e){
  if (dragState && e.pointerId === dragState.id){
    dragState = null;
    vp.classList.remove('dragging');
    if (dragMoved) setTimeout(function(){ dragMoved = false; }, 0);
  }
}
vp.addEventListener('pointerup', endDrag);
vp.addEventListener('pointercancel', endDrag);

/* main loop */
function tick(ts){
  var dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
  lastTs = ts;
  var overlayUp = !$('#overlay').hidden;

  if (!overlayUp){
    var f = ((keys.KeyW || keys.ArrowUp) ? 1 : 0) - ((keys.KeyS || keys.ArrowDown) ? 1 : 0);
    var r = ((keys.KeyD || keys.ArrowRight) ? 1 : 0) - ((keys.KeyA || keys.ArrowLeft) ? 1 : 0);
    if (f || r){
      cancelGlide();
      tgt.yaw -= r * 1.85 * dt;
      if (f){
        tgt.x += -Math.sin(tgt.yaw) * f * 580 * dt;
        tgt.z += -Math.cos(tgt.yaw) * f * 580 * dt;
      }
      clampPos(tgt);
    }
  }

  var k = 1 - Math.exp(-dt * (RM ? 12 : 5.2));
  cam.x += (tgt.x - cam.x) * k;
  cam.z += (tgt.z - cam.z) * k;
  cam.yaw += (tgt.yaw - cam.yaw) * k;

  if (glide){
    if (Math.hypot(cam.x - tgt.x, cam.z - tgt.z) < 12 && Math.abs(tgt.yaw - cam.yaw) < 0.05){
      var open = pendingOpen;
      cancelGlide();
      if (open) open();
    }
  }

  var yawOff = 0, yOff = 0;
  if (!RM && !overlayUp){
    yawOff = Math.sin(ts * 0.00042) * 0.0045;
    yOff = Math.sin(ts * 0.00085) * 2.0;
  }
  world.style.transform =
    'translateZ(' + PERSP + 'px) rotateY(' + (-(cam.yaw + yawOff)) + 'rad) ' +
    'translate3d(' + (-cam.x) + 'px,' + (170 + yOff) + 'px,' + (-cam.z) + 'px)';

  if (mmCam){
    var pt = mapPt(cam.x, cam.z, MM_W, MM_H);
    mmCam.setAttribute('transform', 'translate(' + pt[0].toFixed(1) + ',' + pt[1].toFixed(1) + ') rotate(' + (-cam.yaw * 180 / Math.PI).toFixed(1) + ')');
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

  openPanel('Examination Hall', 'active recall · type before you peek',
    '<p class="muted">Choose a single work or a whole subject. Answer from memory in your own words, then compare and grade yourself — results feed the same scheduler as the flashcards.</p>' +
    '<div class="row" style="margin-top:12px"><div style="flex:1;min-width:220px"><select id="rc-scope">' + opts + '</select></div>' +
    '<button class="btn" id="rc-begin">Begin examination</button></div>' +
    '<div id="rc-area" style="margin-top:16px"></div>');
  $('#rc-begin').addEventListener('click', beginRecall);
  if (preset){
    var sel = $('#rc-scope');
    sel.value = preset;
    if (sel.value === preset) beginRecall();
  }
}
function beginRecall(){
  var v = $('#rc-scope').value;
  var parts = v.split(':');
  var cards;
  var label;
  if (parts[0] === 'w'){
    var w = byId(parts[1]);
    cards = w.cards.slice();
    label = w.title;
  } else {
    cards = allCards.filter(function(c){ return c.work.tags.indexOf(parts[1]) >= 0; });
    label = 'subject · ' + parts[1];
  }
  cards.sort(function(a,b){ return a.due - b.due; });
  rcState = { cards:cards, i:0, revealed:false, label:label, done:0 };
  renderRecall();
}
function renderRecall(){
  var area = $('#rc-area');
  if (!area) return;
  var s = rcState;
  if (s.i >= s.cards.length){
    area.innerHTML = '<div class="sect"><h3>' + esc(s.label) + '</h3>' +
      '<p style="font-size:16px">Examination complete — ' + s.done + ' of ' + s.cards.length + ' prompts answered and graded.</p>' +
      '<p class="muted" style="margin-top:6px">Each grade rescheduled its card in the spaced-repetition queue.</p></div>';
    return;
  }
  var c = s.cards[s.i];
  var h = '<div class="sect"><h3>' + esc(s.label) + ' · prompt ' + (s.i+1) + ' of ' + s.cards.length + '</h3>' +
    '<p class="muted">from <i>' + esc(c.work.title) + '</i> · ' + dueStr(c) + '</p>' +
    '<p style="font-size:17px;line-height:1.5;margin:12px 0">' + esc(c.q) + '</p>';
  if (!s.revealed){
    h += '<textarea id="rc-answer" placeholder="Type your answer from memory…"></textarea>' +
      '<div class="row" style="margin-top:10px"><button class="btn" id="rc-reveal">Reveal answer</button>' +
      '<button class="btn ghost" id="rc-skip">Skip</button></div>';
  } else {
    h += '<div class="note"><div class="note-meta"><span>Your answer</span></div>' +
      '<div class="note-text">' + (s.typed ? esc(s.typed) : '<span class="muted">(left blank)</span>') + '</div></div>' +
      '<div class="note" style="background:#f3ecd8"><div class="note-meta"><span>Reference answer</span></div>' +
      '<div class="note-text">' + esc(c.a) + '</div></div>' +
      '<p class="muted" style="margin:10px 0 6px">How close were you?</p>' +
      '<div class="grade-row" style="justify-content:flex-start">' + gradeButtonsHTML(c) + '</div>';
  }
  h += '</div>';
  area.innerHTML = h;
  if (!s.revealed){
    var ta = $('#rc-answer');
    ta.focus();
    $('#rc-reveal').addEventListener('click', function(){
      s.typed = ta.value.trim(); s.revealed = true; renderRecall();
    });
    $('#rc-skip').addEventListener('click', function(){ s.i++; s.revealed = false; s.typed=''; renderRecall(); });
  } else {
    bindGradeButtons(c, function(){ s.done++; s.i++; s.revealed = false; s.typed=''; renderRecall(); });
  }
}

/* ---------------------- REFLECTIONS ---------------------- */
var quotePool = [];
WORKS.forEach(function(w){ w.quotes.forEach(function(q){ quotePool.push({ w:w, q:q }); }); });
var curQuote = null;
function pickQuote(){
  var i, prev = curQuote;
  do { i = Math.floor(Math.random() * quotePool.length); } while (quotePool.length > 1 && quotePool[i] === prev);
  curQuote = quotePool[i];
}
function showReflections(){
  pickQuote();
  openPanel('Reading Room', 'reflections · synthesis over storage', reflHTML());
  bindRefl();
}
function reflHTML(){
  var h = '<p class="muted">The room offers you a passage from the collection. Sit with it, then write what it means to you now.</p>' +
    '<blockquote id="rf-quote">“' + esc(curQuote.q) + '”<br>' +
    '<span style="font-style:normal;font-size:12px;color:#8a7850">— ' + esc(curQuote.w.author) + ', <i>' + esc(curQuote.w.title) + '</i></span></blockquote>' +
    '<div class="row" style="margin-bottom:10px"><button class="btn ghost" id="rf-another">Offer me another</button></div>' +
    '<textarea id="rf-text" placeholder="Write your reflection… What does this change about how you think or act?"></textarea>' +
    '<div class="row" style="margin-top:10px"><button class="btn" id="rf-save">Save reflection</button></div>' +
    '<div class="sect"><h3>Past reflections (' + REFLECTIONS.length + ')</h3><div id="rf-list">' + reflListHTML() + '</div></div>';
  return h;
}
function reflListHTML(){
  return REFLECTIONS.map(function(r){
    return '<div class="refl"><div class="note-meta"><span>' + fmtDate(r.date) + ' · on <i>' + esc(r.source) + '</i></span></div>' +
      '<div class="rq">“' + esc(r.quote) + '”</div>' +
      '<div class="note-text">' + esc(r.text) + '</div></div>';
  }).join('');
}
function bindRefl(){
  $('#rf-another').addEventListener('click', function(){
    pickQuote();
    $('#ov-body').innerHTML = reflHTML();
    bindRefl();
  });
  $('#rf-save').addEventListener('click', function(){
    var ta = $('#rf-text');
    var v = ta.value.trim();
    if (!v) return;
    REFLECTIONS.unshift({ date: todayISO(), workId: curQuote.w.id, source: curQuote.w.title, quote: curQuote.q, text: v });
    $('#ov-body').innerHTML = reflHTML();
    bindRefl();
  });
}

/* ---------------------- KNOWLEDGE GRAPH ---------------------- */
function showGraph(){
  openPanel('Collection Map', 'knowledge graph · linked by shared tags',
    '<p class="muted">Each frame in the hall, drawn as a node. Lines bind works that share tags — thicker lines, more shared ground. Hover to isolate a work’s neighborhood; click to open its placard.</p>' +
    '<div id="graph-wrap" style="margin-top:12px"></div><div id="graph-cap"></div>');
  buildGraphSVG();
}
var TYPE_COLOR = { book:'#a8864b', essay:'#5c6b4a', article:'#58708f', podcast:'#8a5a6e' };
function buildGraphSVG(){
  var W = 720, H = 540;
  var N = WORKS.map(function(w, i){
    var a = i / WORKS.length * 2 * Math.PI;
    return { w:w, x: W/2 + Math.cos(a) * 200, y: H/2 + Math.sin(a) * 150, vx:0, vy:0 };
  });
  var E = [];
  for (var i = 0; i < N.length; i++)
    for (var j = i+1; j < N.length; j++){
      var s = sharedTags(N[i].w, N[j].w);
      if (s.length) E.push({ a:i, b:j, s:s });
    }
  for (var it = 0; it < 320; it++){
    for (i = 0; i < N.length; i++)
      for (j = i+1; j < N.length; j++){
        var dx = N[j].x - N[i].x, dy = N[j].y - N[i].y;
        var d2 = dx*dx + dy*dy || 1, d = Math.sqrt(d2);
        var f = 3400 / d2;
        dx /= d; dy /= d;
        N[i].vx -= dx*f; N[i].vy -= dy*f;
        N[j].vx += dx*f; N[j].vy += dy*f;
      }
    E.forEach(function(e){
      var a = N[e.a], b = N[e.b];
      var dx = b.x - a.x, dy = b.y - a.y;
      var d = Math.hypot(dx, dy) || 1;
      var rest = 230 - 45 * e.s.length;
      var f = (d - rest) * 0.014;
      dx /= d; dy /= d;
      a.vx += dx*f; a.vy += dy*f;
      b.vx -= dx*f; b.vy -= dy*f;
    });
    N.forEach(function(n){
      n.vx += (W/2 - n.x) * 0.0035;
      n.vy += (H/2 - n.y) * 0.0045;
      n.x = clamp(n.x + n.vx, 55, W-55);
      n.y = clamp(n.y + n.vy, 40, H-46);
      n.vx *= 0.42; n.vy *= 0.42;
    });
  }
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" id="gsvg" xmlns="http://www.w3.org/2000/svg">';
  E.forEach(function(e, idx){
    var a = N[e.a], b = N[e.b];
    svg += '<line class="gedge" data-e="' + idx + '" x1="' + a.x.toFixed(1) + '" y1="' + a.y.toFixed(1) +
      '" x2="' + b.x.toFixed(1) + '" y2="' + b.y.toFixed(1) +
      '" stroke-width="' + (e.s.length * 1.4) + '" opacity="' + (0.14 + e.s.length * 0.1) + '"/>';
  });
  N.forEach(function(n, idx){
    var short = n.w.title.length > 22 ? n.w.title.slice(0, 20) + '…' : n.w.title;
    svg += '<g class="gnode" data-n="' + idx + '" data-view="' + n.w.id + '">' +
      '<circle cx="' + n.x.toFixed(1) + '" cy="' + n.y.toFixed(1) + '" r="' + (13 + n.w.cards.length * 1.5) + '" fill="' + TYPE_COLOR[n.w.type] + '"/>' +
      '<text x="' + n.x.toFixed(1) + '" y="' + (n.y + 30).toFixed(1) + '">' + esc(short) + '</text></g>';
  });
  svg += '</svg>';
  svg += '<div class="row" style="margin-top:8px;font-size:11.5px;color:#6e5527">' +
    Object.keys(TYPE_COLOR).map(function(t){
      return '<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + TYPE_COLOR[t] + ';margin-right:4px"></span>' + TYPE_LABEL[t] + 's</span>';
    }).join('') + '</div>';
  $('#graph-wrap').innerHTML = svg;
  var gsvg = $('#gsvg');
  var cap = $('#graph-cap');
  var nodes = gsvg.querySelectorAll('.gnode');
  var edges = gsvg.querySelectorAll('.gedge');
  nodes.forEach(function(g){
    var ni = +g.dataset.n;
    g.addEventListener('mouseenter', function(){
      gsvg.classList.add('hl');
      var neigh = {}; neigh[ni] = true;
      var tags = [];
      E.forEach(function(e, idx){
        if (e.a === ni || e.b === ni){
          neigh[e.a] = neigh[e.b] = true;
          edges[idx].classList.add('on');
          e.s.forEach(function(t){ if (tags.indexOf(t) < 0) tags.push(t); });
        }
      });
      nodes.forEach(function(g2){ if (neigh[+g2.dataset.n]) g2.classList.add('on'); });
      var count = Object.keys(neigh).length - 1;
      cap.textContent = N[ni].w.title + ' — linked to ' + count + ' work' + (count===1?'':'s') + ' through: ' + tags.join(', ');
    });
    g.addEventListener('mouseleave', function(){
      gsvg.classList.remove('hl');
      nodes.forEach(function(g2){ g2.classList.remove('on'); });
      edges.forEach(function(e2){ e2.classList.remove('on'); });
      cap.textContent = '';
    });
    g.addEventListener('click', function(){ showDetail(g.dataset.view); });
  });
}

/* ---------------------- FLOOR PLAN (2D fallback) ---------------------- */
function showFloorplan(){
  var order = ['book','essay','article','podcast'];
  var h = '<p class="muted">Every work in the collection, no walking required. “Walk” glides you to its frame in the hall.</p>';
  order.forEach(function(t){
    var items = WORKS.filter(function(w){ return w.type === t; });
    h += '<div class="sect"><h3>' + TYPE_WING[t] + ' (' + items.length + ')</h3>';
    items.forEach(function(w){
      h += '<div class="fp-item"><b>' + esc(w.title) + '</b>' +
        '<span class="fp-meta">' + esc(w.author) + ', ' + esc(w.pub) + ' · consumed ' + fmtMonth(w.consumed) + ' · ' + w.tags.join(', ') + '</span>' +
        '<span class="row"><button class="mini" data-view="' + w.id + '">View</button>' +
        '<button class="mini" data-walk="work:' + w.id + '">Walk</button></span></div>';
    });
    h += '</div>';
  });
  h += '<div class="sect"><h3>Stations</h3>';
  Object.keys(STATION_NAME).forEach(function(id){
    h += '<div class="fp-item"><b style="font-style:normal">' + STATION_NAME[id] + '</b>' +
      '<span class="row"><button class="mini" data-station="' + id + '">Open</button>' +
      '<button class="mini" data-walk="station:' + id + '">Walk</button></span></div>';
  });
  h += '</div>';
  openPanel('Floor Plan', 'index of the collection', h);
  var body = $('#ov-body');
  body.querySelectorAll('[data-view]').forEach(function(b){
    b.addEventListener('click', function(){ showDetail(b.dataset.view); });
  });
  body.querySelectorAll('[data-station]').forEach(function(b){
    b.addEventListener('click', function(){ STATIONS[b.dataset.station].open(); });
  });
  body.querySelectorAll('[data-walk]').forEach(function(b){
    b.addEventListener('click', function(){
      closePanel();
      var parts = b.dataset.walk.split(':');
      if (parts[0] === 'work') glideTo(standForWork(byId(parts[1])), null);
      else glideTo(STATIONS[parts[1]].stand, null);
    });
  });
}

/* ---------------------- SERENDIPITY ---------------------- */
var toastEl = $('#toast');
var lastSer = null;
function serendipityPool(){
  var arr = [];
  WORKS.forEach(function(w){
    w.notes.forEach(function(n){ arr.push({ kind:'note', w:w, d:n.d, text:n.t }); });
  });
  REFLECTIONS.forEach(function(r){ arr.push({ kind:'refl', r:r, d:r.date, text:r.text }); });
  return arr;
}
function showSerendipity(){
  var pool = serendipityPool();
  if (!pool.length) return;
  var it;
  do { it = pool[Math.floor(Math.random() * pool.length)]; }
  while (pool.length > 1 && it.text === lastSer);
  lastSer = it.text;
  var label = it.kind === 'note' ? 'From the archives · note' : 'From the archives · reflection';
  var src = it.kind === 'note' ? it.w.title : it.r.source;
  var snippet = it.text.length > 175 ? it.text.slice(0, 172).replace(/\s+\S*$/, '') + '…' : it.text;
  toastEl.innerHTML =
    '<div class="t-kicker"><span>' + label + '</span><button id="t-x" aria-label="Dismiss">×</button></div>' +
    '<div class="t-src">' + esc(src) + ' · ' + fmtDate(it.d) + '</div>' +
    '<div class="t-text">“' + esc(snippet) + '”</div>' +
    '<div class="row"><button class="mini" id="t-another">Another</button><button class="mini" id="t-open">Open</button></div>';
  toastEl.hidden = false;
  $('#t-x').addEventListener('click', hideToast);
  $('#t-another').addEventListener('click', showSerendipity);
  $('#t-open').addEventListener('click', function(){
    hideToast();
    if (it.kind === 'note') showDetail(it.w.id);
    else showReflections();
  });
}
function hideToast(){ toastEl.hidden = true; }

/* auto-surface a memory shortly after arrival — but never inside the gallery iframe */
var embedded = true;
try { embedded = window.self !== window.top; } catch(e){ embedded = true; }
if (!embedded){
  setTimeout(function(){
    if ($('#overlay').hidden && toastEl.hidden) showSerendipity();
  }, 5200);
}
