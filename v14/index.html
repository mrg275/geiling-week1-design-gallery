<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v14 — Mind Gym</title>
<style>
  /* ============ RESET / TOKENS ============ */
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#0a0c0f;
    --ink:#f2f5f7;
    --ink-dim:#9aa5ad;
    --volt:#d6ff3f;
    --cyan:#3fd9ff;
    --orange:#ff8a3d;
    --magenta:#ff4fa3;
    --panel:#12161b;
    --panel-2:#181e25;
    --line:#2a323b;
    --display:Impact, Haettenschweiler, "Arial Narrow Bold", "Helvetica Neue", sans-serif;
    --body:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  html,body{ height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:var(--body); }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background:var(--volt); color:#0a0c0f; }

  /* ============ 3D WORLD ============ */
  #viewport{
    position:fixed; inset:0;
    perspective:1050px;
    perspective-origin:50% 50%;
    overflow:hidden;
    background:
      radial-gradient(130% 90% at 50% 30%, #11161c 0%, #07090b 70%);
  }
  #camera{
    position:absolute; left:50%; top:50%;
    width:0; height:0;
    transform-style:preserve-3d;
  }
  .node{ position:absolute; left:0; top:0; transform-style:preserve-3d; }
  .face, .plane{
    position:absolute; left:0; top:0;
    backface-visibility:hidden;
  }
  .plane{ transform-style:flat; }

  /* floor: rubber tiles */
  .floor{
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.045) 0 2px, transparent 2px 120px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.045) 0 2px, transparent 2px 120px),
      radial-gradient(60% 55% at 50% 42%, #22282e 0%, #15191d 55%, #0c0f12 100%);
  }
  .floor-logo{
    font-family:var(--display); letter-spacing:.35em; text-align:center;
    color:rgba(214,255,63,.13); font-size:120px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .wall{
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 3px, transparent 3px 240px),
      linear-gradient(180deg, #232a31 0%, #171c21 55%, #10141a 100%);
  }
  .ceil{
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 2px, transparent 2px 160px),
      linear-gradient(180deg,#0a0d10,#11151a);
  }
  .led{
    background:linear-gradient(90deg, var(--volt), var(--cyan), var(--volt));
    box-shadow:0 0 18px 4px rgba(120,230,160,.45);
    border-radius:3px;
  }
  .led.v{ background:linear-gradient(180deg, var(--cyan), var(--volt), var(--cyan)); }

  .wall-sign{
    font-family:var(--display);
    color:#eef3f5;
    text-align:center;
    letter-spacing:.14em;
    line-height:.95;
    text-shadow:0 0 34px rgba(214,255,63,.25);
    pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  }
  .wall-sign .accent{ color:var(--volt); }
  .wall-sign small{
    font-family:var(--body); font-weight:700; letter-spacing:.5em;
    color:var(--ink-dim); font-size:.16em;
  }
  .side-sign{
    font-family:var(--display); letter-spacing:.3em; color:rgba(255,255,255,.10);
    display:flex; align-items:center; justify-content:center; pointer-events:none;
  }

  /* mirror wall */
  .mirror{
    background:
      linear-gradient(115deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.03) 28%, rgba(255,255,255,.12) 42%, rgba(255,255,255,.02) 60%, rgba(255,255,255,.09) 100%),
      linear-gradient(180deg,#39434c,#232a31);
    border:14px solid #0c0f12;
    cursor:pointer;
  }
  .mirror:hover{ outline:3px solid var(--cyan); }

  /* lockers */
  .locker-row{ display:flex; gap:8px; padding:8px; background:#0d1013; border-radius:4px; }
  .locker{
    flex:1 1 0; border:0; border-radius:4px; position:relative;
    background:linear-gradient(180deg,#39424b 0%, #2b333b 60%, #20262d 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.14), inset 0 -4px 10px rgba(0,0,0,.5);
    color:var(--ink); text-align:center; padding:14px 6px 10px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .locker:hover{ outline:3px solid var(--volt); }
  .locker .vents{ width:70%; height:26px;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,.5) 0 4px, transparent 4px 9px); border-radius:2px; }
  .locker .lk-type{ width:70%; height:6px; border-radius:3px; }
  .locker .lk-title{
    font-family:var(--display); font-size:15px; letter-spacing:.05em; line-height:1.05;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
  }
  .locker .lk-due{
    position:absolute; top:6px; right:6px; min-width:22px; height:22px; border-radius:11px;
    background:var(--volt); color:#0a0c0f; font-weight:800; font-size:13px;
    display:flex; align-items:center; justify-content:center; padding:0 5px;
  }

  /* floating station labels (billboards) */
  .tag3d{
    pointer-events:none;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    white-space:nowrap;
  }
  .tag3d .pill{
    font-family:var(--display); font-size:24px; letter-spacing:.14em;
    background:rgba(10,12,15,.82); border:2px solid var(--volt); color:var(--volt);
    padding:6px 18px 5px; border-radius:6px;
    box-shadow:0 0 24px rgba(214,255,63,.25);
  }
  .tag3d .sub{ font-size:12.5px; font-weight:700; letter-spacing:.26em; color:var(--ink-dim);
    background:rgba(10,12,15,.72); padding:3px 9px; border-radius:4px; text-transform:uppercase; }
  .tag3d .stem{ width:2px; height:28px; background:linear-gradient(180deg,var(--volt),transparent); }

  .station{ cursor:pointer; }
  .station:hover .face{ filter:brightness(1.35) !important; }
  .screenface{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    font-family:var(--display); letter-spacing:.12em; }

  .poster{
    background:#10141a; border:10px solid #06080a; color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    font-family:var(--display); letter-spacing:.2em; cursor:pointer;
  }
  .poster:hover{ outline:3px solid var(--cyan); }

  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(120% 100% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%);
  }

  /* ============ HUD ============ */
  #hud{
    position:fixed; top:0; left:0; right:0; z-index:55;
    display:flex; align-items:center; gap:14px;
    padding:10px 16px;
    background:linear-gradient(180deg, rgba(8,10,12,.92), rgba(8,10,12,.55) 75%, transparent);
  }
  #hud a.gal{
    color:var(--ink-dim); text-decoration:none; font-weight:700; font-size:13px;
    border:1px solid var(--line); border-radius:6px; padding:6px 10px; background:rgba(14,17,21,.7);
    white-space:nowrap;
  }
  #hud a.gal:hover{ color:var(--volt); border-color:var(--volt); }
  #hud .brand{
    font-family:var(--display); letter-spacing:.18em; font-size:20px; color:var(--ink);
    white-space:nowrap;
  }
  #hud .brand b{ color:var(--volt); font-weight:400; }
  #hud .spacer{ flex:1; }
  .hudbtn{
    border:1px solid var(--line); background:rgba(14,17,21,.75); color:var(--ink);
    border-radius:6px; padding:6px 12px; font-size:13px; font-weight:700; white-space:nowrap;
  }
  .hudbtn:hover{ border-color:var(--volt); color:var(--volt); }
  .hudbtn .badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:20px; height:20px; border-radius:10px; padding:0 6px; margin-left:7px;
    background:var(--volt); color:#0a0c0f; font-weight:800; font-size:12px;
  }
  .hudstat{
    border:1px solid var(--line); background:rgba(14,17,21,.75); border-radius:6px;
    padding:5px 12px; font-size:12px; color:var(--ink-dim); font-weight:700; white-space:nowrap;
  }
  .hudstat b{ color:var(--volt); font-size:14px; }
  #hint{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:40;
    background:rgba(10,12,15,.78); border:1px solid var(--line); border-radius:20px;
    color:var(--ink-dim); font-size:12.5px; font-weight:600; letter-spacing:.04em;
    padding:7px 18px; white-space:nowrap; pointer-events:none;
  }
  #hint kbd{
    font-family:inherit; background:#232a31; border-radius:4px; padding:1px 6px; color:var(--ink);
    border:1px solid #39434c; border-bottom-width:2px; font-size:11.5px;
  }

  /* ============ OVERLAYS ============ */
  #shade{
    position:fixed; inset:0; z-index:50; background:rgba(4,5,7,.72);
    backdrop-filter:blur(3px); display:none;
  }
  #shade.on{ display:flex; align-items:center; justify-content:center; padding:56px 16px 20px; }
  .ovpanel{
    width:min(960px, 100%); max-height:calc(100vh - 86px);
    background:var(--panel); border:1px solid var(--line); border-top:4px solid var(--volt);
    border-radius:12px; display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
  }
  .ovhead{
    display:flex; align-items:center; gap:12px; padding:16px 20px 12px;
    border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  .ovhead h2{
    font-family:var(--display); font-weight:400; letter-spacing:.1em; font-size:26px;
    text-transform:uppercase;
  }
  .ovhead .kicker{
    font-size:11px; font-weight:800; letter-spacing:.35em; color:var(--volt);
    text-transform:uppercase; width:100%;
  }
  .ovhead .x{
    margin-left:auto; border:1px solid var(--line); background:transparent; color:var(--ink-dim);
    width:34px; height:34px; border-radius:8px; font-size:16px; line-height:1;
  }
  .ovhead .x:hover{ color:var(--volt); border-color:var(--volt); }
  .ovbody{ padding:18px 20px 24px; overflow-y:auto; }

  .chip{
    display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.08em;
    border:1px solid var(--line); color:var(--ink-dim); border-radius:14px; padding:3px 11px;
    text-transform:uppercase; background:var(--panel-2);
  }
  .chip.type-book{ color:var(--volt); border-color:rgba(214,255,63,.5); }
  .chip.type-essay{ color:var(--cyan); border-color:rgba(63,217,255,.5); }
  .chip.type-article{ color:var(--orange); border-color:rgba(255,138,61,.5); }
  .chip.type-podcast{ color:var(--magenta); border-color:rgba(255,79,163,.5); }

  .btn{
    border:1px solid var(--line); background:var(--panel-2); color:var(--ink);
    border-radius:8px; padding:9px 16px; font-weight:700; font-size:13.5px;
  }
  .btn:hover{ border-color:var(--volt); color:var(--volt); }
  .btn.primary{ background:var(--volt); border-color:var(--volt); color:#0a0c0f; }
  .btn.primary:hover{ filter:brightness(1.08); color:#0a0c0f; }
  .btn.sm{ padding:5px 10px; font-size:12px; border-radius:6px; }

  .meta-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0; }
  .meta-cell{ background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .meta-cell .k{ font-size:10.5px; font-weight:800; letter-spacing:.2em; color:var(--ink-dim); text-transform:uppercase; }
  .meta-cell .v{ font-size:14.5px; font-weight:600; margin-top:3px; }

  .sechead{
    font-family:var(--display); letter-spacing:.14em; font-size:15px; color:var(--ink-dim);
    text-transform:uppercase; margin:22px 0 10px; display:flex; align-items:center; gap:10px;
  }
  .sechead::after{ content:""; flex:1; height:1px; background:var(--line); }

  blockquote.q{
    border-left:3px solid var(--volt); background:var(--panel-2);
    padding:12px 16px; border-radius:0 8px 8px 0; margin-bottom:10px;
    font-size:14.5px; line-height:1.55; font-style:italic; color:#dde4e8;
  }

  .note{
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; margin-bottom:10px;
  }
  .note .ntop{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .note .ndate{ font-size:11px; font-weight:700; letter-spacing:.14em; color:var(--ink-dim); text-transform:uppercase; }
  .note p{ font-size:14.5px; line-height:1.6; }
  .note textarea{ margin-top:4px; }
  textarea{
    width:100%; min-height:88px; resize:vertical;
    background:#0d1013; color:var(--ink); border:1px solid var(--line); border-radius:8px;
    padding:11px 13px; font-family:var(--body); font-size:14.5px; line-height:1.55;
  }
  textarea:focus{ outline:none; border-color:var(--volt); }

  .strength{ margin:4px 0 2px; }
  .strength .row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; }
  .strength .num{ font-family:var(--display); font-size:24px; letter-spacing:.05em; color:var(--volt); }
  .strength .lbl{ font-size:10.5px; font-weight:800; letter-spacing:.22em; color:var(--ink-dim); text-transform:uppercase; }
  .strength .bar{ height:10px; border-radius:5px; background:#0d1013; border:1px solid var(--line); overflow:hidden; }
  .strength .fill{ height:100%; border-radius:5px; background:linear-gradient(90deg,var(--cyan),var(--volt)); }

  /* flashcards */
  .repmeta{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .flip-stage{ perspective:1200px; margin:0 auto 18px; max-width:620px; }
  .flip-card{
    position:relative; width:100%; min-height:250px; cursor:pointer;
    transform-style:preserve-3d; transition:transform .5s;
  }
  .flip-card.flipped{ transform:rotateY(180deg); }
  .cface{
    position:absolute; inset:0; backface-visibility:hidden;
    background:var(--panel-2); border:1px solid var(--line); border-radius:14px;
    display:flex; flex-direction:column; padding:20px 24px;
  }
  .cface.back{ transform:rotateY(180deg); border-color:rgba(214,255,63,.45); }
  .cface .src{ font-size:11px; font-weight:800; letter-spacing:.2em; color:var(--ink-dim); text-transform:uppercase; }
  .cface .mid{ flex:1; display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:18px; line-height:1.55; padding:14px 4px; }
  .cface .hintt{ text-align:center; font-size:11.5px; color:var(--ink-dim); letter-spacing:.1em; font-weight:700; text-transform:uppercase; }
  .grades{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-width:620px; margin:0 auto; }
  .gbtn{ border-radius:10px; border:1px solid var(--line); background:var(--panel-2);
    padding:11px 6px 9px; display:flex; flex-direction:column; gap:3px; align-items:center; }
  .gbtn b{ font-family:var(--display); font-weight:400; letter-spacing:.08em; font-size:16px; }
  .gbtn span{ font-size:10.5px; color:var(--ink-dim); font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  .gbtn:hover{ transform:translateY(-2px); }
  .g0 b{ color:#ff5d5d; } .g1 b{ color:var(--orange); } .g2 b{ color:var(--cyan); } .g3 b{ color:var(--volt); }
  .g0:hover{ border-color:#ff5d5d; } .g1:hover{ border-color:var(--orange); }
  .g2:hover{ border-color:var(--cyan); } .g3:hover{ border-color:var(--volt); }

  .empty{ text-align:center; color:var(--ink-dim); padding:40px 10px; font-size:15px; line-height:1.7; }
  .empty b{ color:var(--volt); font-family:var(--display); font-weight:400; letter-spacing:.1em; font-size:22px; display:block; margin-bottom:6px; }

  /* sprint */
  .pickgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:8px; }
  .pick{ text-align:left; border:1px solid var(--line); background:var(--panel-2); color:var(--ink);
    border-radius:8px; padding:10px 12px; font-size:13.5px; font-weight:600; line-height:1.35; }
  .pick small{ display:block; color:var(--ink-dim); font-weight:600; font-size:11px; margin-top:2px; }
  .pick:hover{ border-color:var(--cyan); }
  .pick.tagpick{ text-align:center; text-transform:uppercase; letter-spacing:.1em; font-weight:800; font-size:12px; }
  .sprint-top{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .timerchip{ font-family:var(--display); font-size:22px; letter-spacing:.1em; color:var(--cyan);
    border:1px solid rgba(63,217,255,.4); border-radius:8px; padding:4px 14px; background:rgba(63,217,255,.07); }
  .prompt-card{ background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px; }
  .prompt-card .src{ font-size:11px; font-weight:800; letter-spacing:.2em; color:var(--ink-dim); text-transform:uppercase; margin-bottom:8px; }
  .prompt-card .qq{ font-size:17.5px; line-height:1.55; }
  .answer-reveal{ background:rgba(214,255,63,.06); border:1px solid rgba(214,255,63,.35); border-radius:12px;
    padding:16px 20px; margin:14px 0; font-size:15px; line-height:1.6; }
  .answer-reveal .k{ font-size:10.5px; font-weight:800; letter-spacing:.25em; color:var(--volt); text-transform:uppercase; display:block; margin-bottom:6px; }

  /* reflections */
  .quotebox{ background:var(--panel-2); border:1px solid var(--line); border-left:4px solid var(--magenta);
    border-radius:0 10px 10px 0; padding:18px 20px; margin-bottom:14px; }
  .quotebox .qt{ font-size:16.5px; line-height:1.6; font-style:italic; }
  .quotebox .at{ margin-top:10px; font-size:12px; font-weight:700; letter-spacing:.1em; color:var(--ink-dim); text-transform:uppercase; }
  .refl{ background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:13px 16px; margin-bottom:10px; }
  .refl .rtop{ display:flex; gap:10px; align-items:baseline; margin-bottom:6px; flex-wrap:wrap; }
  .refl .rdate{ font-size:11px; font-weight:800; letter-spacing:.16em; color:var(--magenta); text-transform:uppercase; }
  .refl .rsrc{ font-size:11px; font-weight:700; color:var(--ink-dim); letter-spacing:.06em; }
  .refl p{ font-size:14.5px; line-height:1.6; }

  /* graph */
  #graphwrap{ background:#0d1013; border:1px solid var(--line); border-radius:12px; padding:6px; }
  #graphsvg{ width:100%; height:auto; display:block; }
  .gleg{ display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--ink-dim); font-weight:700; }
  .gleg i{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  .gnode{ cursor:pointer; }
  .gdim{ opacity:.14; }
  .glabel{ font:600 11px var(--body); fill:#cfd8de; pointer-events:none; }

  /* today whiteboard */
  .board{ background:#e9ecec; color:#1c2227; border-radius:10px; padding:18px 20px;
    box-shadow:inset 0 0 50px rgba(0,0,0,.07); border:6px solid #39424b; }
  .board h3{ font-family:var(--display); letter-spacing:.1em; font-size:22px; margin-bottom:4px; text-transform:uppercase; }
  .board .sub{ font-size:12px; font-weight:700; color:#5a6670; letter-spacing:.12em; text-transform:uppercase; margin-bottom:12px; }
  .board table{ width:100%; border-collapse:collapse; font-size:14px; }
  .board td{ padding:7px 4px; border-bottom:2px dashed #c6cccc; }
  .board td:last-child{ text-align:right; font-weight:800; white-space:nowrap; }
  .board .done{ color:#9aa3a8; text-decoration:line-through; }
  .board .total{ margin-top:12px; font-weight:800; display:flex; justify-content:space-between; font-size:15px; }

  /* floorplan */
  .fp-stations{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; margin-bottom:8px; }
  .fp-st{ text-align:left; border:1px solid var(--line); background:var(--panel-2); color:var(--ink);
    border-radius:10px; padding:13px 15px; }
  .fp-st b{ font-family:var(--display); font-weight:400; letter-spacing:.1em; font-size:17px; color:var(--volt); display:block; }
  .fp-st span{ font-size:12px; color:var(--ink-dim); font-weight:600; }
  .fp-st:hover{ border-color:var(--volt); }
  .worklist{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:8px; }
  .workrow{ display:flex; align-items:center; gap:10px; text-align:left; border:1px solid var(--line);
    background:var(--panel-2); color:var(--ink); border-radius:8px; padding:9px 12px; }
  .workrow:hover{ border-color:var(--volt); }
  .workrow .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .workrow .wt{ font-size:13.5px; font-weight:700; line-height:1.25; }
  .workrow .wa{ font-size:11px; color:var(--ink-dim); font-weight:600; }
  .workrow .due{ margin-left:auto; background:var(--volt); color:#0a0c0f; font-size:11px; font-weight:800;
    border-radius:9px; min-width:18px; height:18px; display:flex; align-items:center; justify-content:center; padding:0 5px; flex:none; }

  /* serendipity toast */
  #toast{
    position:fixed; right:18px; bottom:18px; z-index:60;

/* ---- SM-2-style grading: g = 0 Again / 1 Hard / 2 Good / 3 Easy ---- */
function gradeCard(card, g){
  const now = Date.now();
  if (g === 0){
    card.reps = 0; card.interval = 0;
    card.due = now + 10*60000;                       // retry in 10 min
    card.ef = Math.max(1.3, card.ef - 0.2);
    streak = 0;
    card.work.mastery = Math.max(60, card.work.mastery - 5);
  } else {
    if (g === 1){ card.interval = Math.max(1, Math.round(card.interval * 1.2)); card.ef = Math.max(1.3, card.ef - 0.15); }
    else if (g === 2){ card.interval = card.reps === 0 ? 1 : card.reps === 1 ? 3 : Math.round(card.interval * card.ef); card.work.mastery += 5; }
    else { card.interval = card.reps === 0 ? 2 : Math.round(card.interval * card.ef * 1.3); card.ef = Math.min(2.8, card.ef + 0.1); card.work.mastery += 10; }
    card.reps++; card.due = now + card.interval * DAY;
    streak++;
  }
  sessionReps++; repsInSet++;
  if (repsInSet >= REPS_PER_SET){ repsInSet = 0; setCount++; flashSet(); }
  updateHUD();
}

function el(cls, parent, html){
  const d = document.createElement('div');
  if (cls) d.className = cls;
  if (html !== undefined) d.innerHTML = html;
  (parent || cameraEl).appendChild(d);
  return d;
}
/* a flat plane centered at (x,y,z) */
function plane(opts){
  const p = el('plane ' + (opts.cls||''), opts.parent, opts.html);
  p.style.width = opts.w + 'px'; p.style.height = opts.h + 'px';
  p.style.transform = `translate(-50%,-50%) translate3d(${opts.x||0}px,${opts.y||0}px,${opts.z||0}px)` +
    (opts.ry ? ` rotateY(${opts.ry}deg)` : '') + (opts.rx ? ` rotateX(${opts.rx}deg)` : '') +
    (opts.tz ? ` translateZ(${opts.tz}px)` : '');
  if (opts.bg) p.style.background = opts.bg;
  if (opts.style) Object.assign(p.style, opts.style);
  if (!opts.clickable) p.style.pointerEvents = 'none';
  return p;
}
/* a 3D node (group) at (x,y,z) rotated ry */
function group(x,y,z,ry,parent,cls){
  const g = el('node ' + (cls||''), parent);
  g.style.transform = `translate3d(${x}px,${y}px,${z}px)` + (ry?` rotateY(${ry}deg)`:'');
  return g;
}
/* a shaded box centered at (x,y,z) inside parent group */
function box(parent, x,y,z, w,h,d, color, opts){
  opts = opts || {};
  const g = group(x,y,z,opts.ry||0,parent);
  const faces = [
    {w:w,h:h,t:`rotateY(0deg) translateZ(${d/2}px)`,   b:1},
    {w:w,h:h,t:`rotateY(180deg) translateZ(${d/2}px)`, b:.5},
    {w:d,h:h,t:`rotateY(90deg) translateZ(${w/2}px)`,  b:.78},
    {w:d,h:h,t:`rotateY(-90deg) translateZ(${w/2}px)`, b:.66},
    {w:w,h:d,t:`rotateX(90deg) translateZ(${h/2}px)`,  b:1.15},
    {w:w,h:d,t:`rotateX(-90deg) translateZ(${h/2}px)`, b:.35}
  ];
  faces.forEach((f,i)=>{
    const fe = el('face', g);
    fe.style.width = f.w+'px'; fe.style.height = f.h+'px';
    fe.style.transform = `translate(-50%,-50%) ${f.t}`;
    fe.style.background = color;
    fe.style.filter = `brightness(${f.b})`;
    if (opts.faceCls) fe.classList.add(opts.faceCls);
    if (opts.front && i===0){ fe.innerHTML = opts.front; fe.classList.add('screenface'); }
  });
  return g;
}

function approachYaw(fromX, fromZ, toX, toZ){
  const dx = toX - fromX, dz = toZ - fromZ;
  return Math.atan2(-dx, -dz) * 180/Math.PI; // forward = (-sin yaw, -cos yaw)
}

/* =====================================================================
   CAMERA / MOVEMENT
===================================================================== */
const cam = { x:0, y:-150, z:160, yaw:0 };
const PITCH = -12;  /* slight downward tilt so the floor and equipment fill the frame */
let walkTarget = null;      // {x,z,yaw,then}
const keys = {};
let lastT = performance.now();
let moving = false, bobPhase = 0;

function glide(x, z, yaw, then){
  walkTarget = { x, z, yaw, then };
}
function walkTo(id){
  const s = STATIONS[id];
  if (!s || !s.approach) { if (s) s.open(); return; }
  glide(s.approach.x, s.approach.z, s.approach.yaw, s.open);
}
function clampRoom(){
  cam.x = Math.max(-880, Math.min(880, cam.x));
  cam.z = Math.max(-1110, Math.min(170, cam.z));
}
function normAngle(a){ while(a > 180) a -= 360; while(a < -180) a += 360; return a; }

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT')) return;
  if (e.key === 'Escape'){ if (toastEl.classList.contains('on')) hideToast(); else closeOverlay(); return; }
  if (overlayOpen) return;
  const k = e.key.toLowerCase();
  if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){
    keys[k] = true; walkTarget = null; e.preventDefault();
  }
});
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function tick(now){
  const dt = Math.min(0.05, (now - lastT)/1000); lastT = now;
  const SPEED = 560, TURN = 130;
  moving = false;
  if (!overlayOpen){
    if (keys['a'] || keys['arrowleft'])  { cam.yaw += TURN*dt; }
    if (keys['d'] || keys['arrowright']) { cam.yaw -= TURN*dt; }
    let mv = 0;
    if (keys['w'] || keys['arrowup'])   mv = 1;
    if (keys['s'] || keys['arrowdown']) mv = -1;
    if (mv){
      const r = cam.yaw * Math.PI/180;
      cam.x += -Math.sin(r) * SPEED * dt * mv;
      cam.z += -Math.cos(r) * SPEED * dt * mv;
      moving = true;
    }
    if (walkTarget){
      const dx = walkTarget.x - cam.x, dz = walkTarget.z - cam.z;
      const dist = Math.hypot(dx, dz);
      const dyaw = normAngle(walkTarget.yaw - cam.yaw);
      if (dist > 6){
        const step = Math.min(dist, 700*dt);
        cam.x += dx/dist*step; cam.z += dz/dist*step; moving = true;
      }
      cam.yaw += dyaw * Math.min(1, 5*dt);
      if (dist <= 6 && Math.abs(dyaw) < 2.5){
        const then = walkTarget.then; walkTarget = null;
        if (then) then();
      }
    }
    clampRoom();
  }
  // head bob (skipped under reduced motion)
  if (!RM && moving){ bobPhase += dt*9; cam.y = -150 + Math.sin(bobPhase)*3.2; }
  else cam.y = -150;

  cameraEl.style.transform =
    `rotateX(${PITCH}deg) rotateY(${-cam.yaw}deg) translate3d(${-cam.x}px, ${-cam.y}px, ${-cam.z}px)`;
  for (const b of billboards){
    b.el.style.transform = `translate(-50%,-50%) translate3d(${b.x}px,${b.y}px,${b.z}px) rotateY(${cam.yaw}deg)`;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

}

     <div class="sechead">My notes</div>
     ${notesHTML}

       <div class="ntop"><span class="ndate">New note</span></div>
       <textarea id="noteNew" placeholder="Add a personal note&hellip;"></textarea>
       <div style="margin-top:9px"><button class="btn sm primary" onclick="addNote('${w.id}')">Add note</button></div>
     </div>
     <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
       <button class="btn primary" onclick="openSprintWork('${w.id}')">Sprint this work</button>
       <button class="btn" onclick="openReps()">Go to the Rack</button>
     </div>`,
    TYPE_COLOR[w.type]);
}
function workById(id){ return WORKS.find(w=>w.id===id); }
function editNote(id,i){ editingNote = i; renderDetail(workById(id)); }
function cancelNote(id){ editingNote = null; renderDetail(workById(id)); }
function saveNote(id,i){
  const w = workById(id), ta = document.getElementById('noteEdit');
  const v = ta.value.trim();
  if (v) w.notes[i].text = v;
  editingNote = null; renderDetail(w);
}
function addNote(id){
  const w = workById(id), ta = document.getElementById('noteNew');
  const v = ta.value.trim();
  if (!v) { ta.focus(); return; }
  w.notes.push({ date: new Date().toISOString().slice(0,10), text:v });
  editingNote = null; renderDetail(w);
}

/* =====================================================================
   FEATURE: FLASHCARD REPS (squat rack)
===================================================================== */
let repQueue = [], repIdx = 0, repFlipped = false;
function buildRepQueue(){
  const due = CARDS.filter(c=>c.due<=Date.now()).sort((a,b)=>a.due-b.due);
  const rest = CARDS.filter(c=>c.due>Date.now()).sort(()=>Math.random()-0.5);
  repQueue = due.concat(rest);
  repIdx = 0; repFlipped = false;
}
function openReps(){
  buildRepQueue();
  renderRep();
}
function renderRep(){
  if (repIdx >= repQueue.length){
    openOverlay('THE RACK &middot; FLASHCARDS','Reps',
      `<div class="empty"><b>RACK CLEARED</b>Every card in the gym has been pressed this session.<br>Come back when the whiteboard fills up again.</div>
       <div style="text-align:center"><button class="btn primary" onclick="openReps()">Run it back</button></div>`);
    return;
  }
  const c = repQueue[repIdx];
  const dueNow = c.due <= Date.now();
  openOverlay('THE RACK &middot; FLASHCARDS','Reps',
    `<div class="repmeta">
       <span class="chip">Set ${setCount} &middot; Rep ${repsInSet+1}/${REPS_PER_SET}</span>
       <span class="chip">${repIdx+1} / ${repQueue.length} loaded</span>
       <span class="chip" style="${dueNow?'color:var(--volt);border-color:rgba(214,255,63,.5)':''}">${dueNow?'PROGRAMMED (due)':'extra credit'}</span>
       <span class="chip">interval ${c.interval}d &middot; ease ${c.ef.toFixed(2)}</span>
     </div>
     <div class="flip-stage"><div class="flip-card${repFlipped?' flipped':''}" id="flipCard" onclick="flipRep()">
       <div class="cface"><div class="src">${esc(c.work.title)} &middot; ${esc(c.work.author)}</div>
         <div class="mid">${esc(c.q)}</div><div class="hintt">click to flip</div></div>
       <div class="cface back"><div class="src" style="color:var(--volt)">Answer</div>
         <div class="mid">${esc(c.a)}</div><div class="hintt">grade the rep below</div></div>
     </div></div>
     <div class="grades" style="visibility:${repFlipped?'visible':'hidden'}">
       <button class="gbtn g0" onclick="gradeRep(0)"><b>FAILED REP</b><span>again &middot; 10 min</span></button>
       <button class="gbtn g1" onclick="gradeRep(1)"><b>GRINDER</b><span>hard</span></button>
       <button class="gbtn g2" onclick="gradeRep(2)"><b>CLEAN</b><span>good</span></button>
       <button class="gbtn g3" onclick="gradeRep(3)"><b>EXPLOSIVE</b><span>easy</span></button>
     </div>`);
}
function flipRep(){
  repFlipped = !repFlipped;
  document.getElementById('flipCard').classList.toggle('flipped', repFlipped);
  document.querySelector('.grades').style.visibility = repFlipped ? 'visible' : 'hidden';
}
function gradeRep(g){
  gradeCard(repQueue[repIdx], g);
  repIdx++; repFlipped = false;
  renderRep();
}

function openSprintPicker(){
  openOverlay('THE TREADMILL &middot; ACTIVE RECALL','Recall Sprints',
    `<p style="color:var(--ink-dim);font-size:13.5px;margin-bottom:14px">Pick one work or one subject. You get its prompts in sequence &mdash; type what you remember, reveal, grade the effort. Results feed the same scheduler as the rack.</p>

     <div class="pickgrid">${WORKS.map(w=>
       `<button class="pick" onclick="openSprintWork('${w.id}')" style="border-left:3px solid ${TYPE_COLOR[w.type]}">${esc(w.title)}<small>${esc(w.author)} &middot; ${w.cards.length} prompt${w.cards.length===1?'':'s'}</small></button>`).join('')}
     </div>
     <div class="sechead">Sprint a subject</div>
     <div class="pickgrid">${ALL_TAGS.map(t=>{
        const n = CARDS.filter(c=>c.work.tags.includes(t)).length;
        return `<button class="pick tagpick" onclick="openSprintTag('${t}')">${t}<small>${n} prompts</small></button>`;}).join('')}
     </div>`, 'var(--cyan)');
}
function startSprint(cards, label){
  sprint = { cards: cards.slice().sort(()=>Math.random()-0.5), i:0, label, start:Date.now(), revealed:false, graded:0, score:0 };
  renderSprint();
  if (sprintTimerInt) clearInterval(sprintTimerInt);
  sprintTimerInt = setInterval(()=>{
    const t = document.getElementById('sprintClock');
    if (t && sprint){ const s = Math.floor((Date.now()-sprint.start)/1000);
      t.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
  }, 500);
}
function openSprintWork(id){ const w = workById(id); startSprint(CARDS.filter(c=>c.work===w), w.title); }
function openSprintTag(t){ startSprint(CARDS.filter(c=>c.work.tags.includes(t)), 'Subject: '+t); }
function renderSprint(){
  if (!sprint) return;
  if (sprint.i >= sprint.cards.length){
    const mins = ((Date.now()-sprint.start)/60000).toFixed(1);
    const avg = sprint.graded ? (sprint.score/sprint.graded).toFixed(1) : '—';
    openOverlay('THE TREADMILL &middot; ACTIVE RECALL','Sprint complete',
      `<div class="empty"><b>COOL DOWN</b>${sprint.cards.length} prompts &middot; ${mins} min on the belt &middot; avg effort ${avg}/3<br>The scheduler has been updated with every grade.</div>
       <div style="display:flex;gap:10px;justify-content:center">
         <button class="btn primary" onclick="openSprintPicker()">New sprint</button>
         <button class="btn" onclick="closeOverlay()">Back to floor</button></div>`, 'var(--cyan)');
    if (sprintTimerInt){ clearInterval(sprintTimerInt); sprintTimerInt = null; }
    return;
  }
  const c = sprint.cards[sprint.i];
  openOverlay('THE TREADMILL &middot; ACTIVE RECALL','Recall Sprint',
    `<div class="sprint-top">
       <span class="timerchip" id="sprintClock">00:00</span>
       <span class="chip">${esc(sprint.label)}</span>
       <span class="chip">prompt ${sprint.i+1} / ${sprint.cards.length}</span>
     </div>
     <div class="prompt-card">
       <div class="src">${esc(c.work.title)} &middot; ${esc(c.work.author)}</div>
       <div class="qq">${esc(c.q)}</div>
     </div>
     <textarea id="sprintAnswer" placeholder="Type everything you can retrieve &mdash; the typing is the workout&hellip;"></textarea>
     <div id="sprintReveal">
       <div style="margin-top:12px"><button class="btn primary" onclick="revealSprint()">Reveal answer</button></div>
     </div>`, 'var(--cyan)');
  const ta = document.getElementById('sprintAnswer');
  if (ta) ta.focus();
}
function revealSprint(){
  const c = sprint.cards[sprint.i];
  document.getElementById('sprintReveal').innerHTML =
    `<div class="answer-reveal"><span class="k">Answer</span>${esc(c.a)}</div>
     <p style="font-size:12px;color:var(--ink-dim);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px">How was the rep?</p>
     <div class="grades" style="max-width:none">
       <button class="gbtn g0" onclick="gradeSprint(0)"><b>FAILED REP</b><span>again</span></button>
       <button class="gbtn g1" onclick="gradeSprint(1)"><b>GRINDER</b><span>hard</span></button>
       <button class="gbtn g2" onclick="gradeSprint(2)"><b>CLEAN</b><span>good</span></button>
       <button class="gbtn g3" onclick="gradeSprint(3)"><b>EXPLOSIVE</b><span>easy</span></button>
     </div>`;
}
function gradeSprint(g){
  gradeCard(sprint.cards[sprint.i], g);
  sprint.graded++; sprint.score += g;
  sprint.i++;
  renderSprint();
}

/* =====================================================================
   FEATURE: REFLECTIONS (bench)
===================================================================== */
let currentQuote = null;
function pickQuote(){
  const pool = [];
  WORKS.forEach(w => w.quotes.forEach(q => pool.push({ q, w })));
  let pick = pool[Math.floor(Math.random()*pool.length)];
  if (currentQuote && pool.length > 1){
    while (pick.q === currentQuote.q) pick = pool[Math.floor(Math.random()*pool.length)];
  }
  currentQuote = pick;
}
function openReflections(){ pickQuote(); renderReflections(); }
function renderReflections(keepDraft){
  const draft = keepDraft || '';
  openOverlay('COOL-DOWN BENCH &middot; SYNTHESIS','Reflections',
    `<div class="quotebox">
       <div class="qt">&ldquo;${esc(currentQuote.q)}&rdquo;</div>
       <div class="at">&mdash; ${esc(currentQuote.w.author)}, <i>${esc(currentQuote.w.title)}</i> (${currentQuote.w.pub})</div>
     </div>
     <div style="display:flex;gap:10px;margin-bottom:12px">
       <button class="btn sm" onclick="newQuote()">Different quote</button>
     </div>
     <textarea id="reflText" style="min-height:120px" placeholder="What does this mean in your own words? Where have you seen it play out?">${esc(draft)}</textarea>
     <div style="margin-top:10px"><button class="btn primary" onclick="saveReflection()">Log reflection</button></div>
     <div class="sechead">Reflection log (${REFLECTIONS.length})</div>
     <div id="reflList">${REFLECTIONS.map(r=>
       `<div class="refl"><div class="rtop"><span class="rdate">${r.date}</span><span class="rsrc">on ${esc(r.source)}</span></div>
        <p>${esc(r.text)}</p></div>`).join('')}
     </div>`, 'var(--magenta)');
}
function newQuote(){
  const ta = document.getElementById('reflText');
  pickQuote(); renderReflections(ta ? ta.value : '');
}
function saveReflection(){
  const ta = document.getElementById('reflText');
  const v = ta.value.trim();
  if (!v){ ta.focus(); return; }
  REFLECTIONS.unshift({
    date: new Date().toISOString().slice(0,10),
    source: currentQuote.w.title + ' — ' + currentQuote.w.author,
    quote: currentQuote.q, text: v
  });
  pickQuote(); renderReflections();
}

/* =====================================================================
   FEATURE: KNOWLEDGE GRAPH (mirror wall)
===================================================================== */
let graphLayout = null;
function layoutGraph(){
  const W = 860, H = 540;
  const nodes = WORKS.map((w,i)=>({ w,
    x: W/2 + Math.cos(i/WORKS.length*2*Math.PI)*210,
    y: H/2 + Math.sin(i/WORKS.length*2*Math.PI)*170 }));
  const edges = [];
  for (let i=0;i<WORKS.length;i++) for (let j=i+1;j<WORKS.length;j++){
    const shared = WORKS[i].tags.filter(t=>WORKS[j].tags.includes(t));
    if (shared.length) edges.push({ a:i, b:j, shared });
  }
  for (let it=0; it<220; it++){
    for (let i=0;i<nodes.length;i++) for (let j=i+1;j<nodes.length;j++){
      let dx = nodes[j].x-nodes[i].x, dy = nodes[j].y-nodes[i].y;
      let d = Math.max(30, Math.hypot(dx,dy));
      const f = 9000/(d*d);
      dx/=d; dy/=d;
      nodes[i].x -= dx*f; nodes[i].y -= dy*f;
      nodes[j].x += dx*f; nodes[j].y += dy*f;
    }
    edges.forEach(e=>{
      let dx = nodes[e.b].x-nodes[e.a].x, dy = nodes[e.b].y-nodes[e.a].y;
      const d = Math.hypot(dx,dy)||1;
      const f = (d-170)*0.012*e.shared.length;
      dx/=d; dy/=d;
      nodes[e.a].x += dx*f; nodes[e.a].y += dy*f;
      nodes[e.b].x -= dx*f; nodes[e.b].y -= dy*f;
    });
    nodes.forEach(n=>{
      n.x = Math.max(70, Math.min(W-70, n.x + (W/2-n.x)*0.004));
      n.y = Math.max(46, Math.min(H-46, n.y + (H/2-n.y)*0.004));
    });
  }
  graphLayout = { nodes, edges, W, H };
}
function openGraph(){
  if (!graphLayout) layoutGraph();
  const { nodes, edges, W, H } = graphLayout;
  const edgeHTML = edges.map((e,i)=>
    `<line data-e="${i}" x1="${nodes[e.a].x.toFixed(1)}" y1="${nodes[e.a].y.toFixed(1)}"
      x2="${nodes[e.b].x.toFixed(1)}" y2="${nodes[e.b].y.toFixed(1)}"
      stroke="#3a4651" stroke-width="${e.shared.length*1.4}" opacity=".8"><title>${e.shared.join(', ')}</title></line>`).join('');
  const nodeHTML = nodes.map((n,i)=>{
    const r = 11 + n.w.cards.length*2.6;
    return `<g class="gnode" data-n="${i}">
      <circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${r}" fill="${TYPE_COLOR[n.w.type]}" stroke="#0d1013" stroke-width="3"></circle>
      <text class="glabel" x="${n.x.toFixed(1)}" y="${(n.y+r+14).toFixed(1)}" text-anchor="middle">${esc(n.w.title.length>26 ? n.w.title.slice(0,24)+'…' : n.w.title)}</text>
    </g>`;}).join('');
  openOverlay('MIRROR WALL &middot; MUSCLE MAP','Knowledge Graph',
    `<p style="color:var(--ink-dim);font-size:13px;margin-bottom:10px">Each node is a work; node size = deck size; line thickness = shared themes. Hover to isolate a muscle group, click to open its locker.</p>
     <div id="graphwrap"><svg id="graphsvg" viewBox="0 0 ${W} ${H}">${edgeHTML}${nodeHTML}</svg></div>
     <div class="gleg">
       <span><i style="background:${TYPE_COLOR.book}"></i>Books</span>
       <span><i style="background:${TYPE_COLOR.essay}"></i>Essays</span>
       <span><i style="background:${TYPE_COLOR.article}"></i>Articles</span>
       <span><i style="background:${TYPE_COLOR.podcast}"></i>Podcasts</span>
     </div>`, 'var(--cyan)');
  const svg = document.getElementById('graphsvg');
  const gEls = [...svg.querySelectorAll('.gnode')];
  const eEls = [...svg.querySelectorAll('line')];
  gEls.forEach((g,i)=>{
    g.addEventListener('mouseenter', ()=>{
      const linked = new Set([i]);
      edges.forEach((e,ei)=>{
        const on = e.a===i || e.b===i;
        eEls[ei].classList.toggle('gdim', !on);
        if (on){ linked.add(e.a); linked.add(e.b); eEls[ei].setAttribute('stroke','#3fd9ff'); }
      });
      gEls.forEach((h,j)=>h.classList.toggle('gdim', !linked.has(j)));
    });
    g.addEventListener('mouseleave', ()=>{
      eEls.forEach(l=>{ l.classList.remove('gdim'); l.setAttribute('stroke','#3a4651'); });
      gEls.forEach(h=>h.classList.remove('gdim'));
    });
    g.addEventListener('click', ()=>openDetail(nodes[i].w));
  });
}

/* =====================================================================
   FEATURE: SERENDIPITY (smoothie bar + auto toast)
===================================================================== */
const toastEl = document.getElementById('toast');
let toastItem = null;
function serendipityPool(){
  const pool = [];
  WORKS.forEach(w => w.notes.forEach(n => pool.push({ kind:'note', w, date:n.date, text:n.text })));
  REFLECTIONS.forEach(r => pool.push({ kind:'reflection', date:r.date, text:r.text, source:r.source }));
  return pool;
}
function showToast(){
  const pool = serendipityPool();
  let item = pool[Math.floor(Math.random()*pool.length)];
  if (toastItem && pool.length > 1){
    while (item.text === toastItem.text) item = pool[Math.floor(Math.random()*pool.length)];
  }
  toastItem = item;
  const src = item.kind === 'note'
    ? `${esc(item.w.title)} &middot; note &middot; ${item.date}`
    : `Reflection on ${esc(item.source)} &middot; ${item.date}`;
  const txt = item.text.length > 220 ? item.text.slice(0,217)+'…' : item.text;
  toastEl.innerHTML =
    `<div class="tk">SPOTTER TIP &mdash; FROM YOUR PAST SELF<button class="tx" aria-label="Dismiss" onclick="hideToast()">&#10005;</button></div>
     <p class="body">&ldquo;${esc(txt)}&rdquo;</p>
     <div class="tsrc">${src}</div>
     <div class="tbtns">
       <button class="btn sm" onclick="showToast()">Another</button>
       <button class="btn sm primary" onclick="openToastSource()">Open</button>
     </div>`;
  toastEl.classList.add('on');
}
function hideToast(){ toastEl.classList.remove('on'); }
function openToastSource(){
  if (!toastItem) return;
  hideToast();
  if (toastItem.kind === 'note') openDetail(toastItem.w);
  else { pickQuote(); renderReflections(); }
}
/* auto-appear a few seconds after load — but not when embedded (gallery thumbnail) */
if (window.self === window.top){
  setTimeout(()=>{ if (!toastEl.classList.contains('on')) showToast(); }, 6000);
}

updateHUD();

/* optional deep link: ?view=reps|sprint|reflect|graph|today|plan|toast|work:<id> */
try{
  const v = new URLSearchParams(location.search).get('view');
  if (v){
    if (v.indexOf('work:') === 0){ const w = workById(v.slice(5)); if (w) openDetail(w); }
    else if (v === 'today') openToday();
    else if (v === 'plan') openFloorPlan();
    else if (v === 'toast') showToast();
    else if (STATIONS[v] && STATIONS[v].open) STATIONS[v].open();
  }
}catch(err){ /* ignore malformed deep links */ }
